groups:
  - name: findyourbuddy_availability
    rules:
      - alert: BackendScrapeDown
        expr: up{job="backend-api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Backend metrics scrape is failing"
          description: "Prometheus cannot scrape {{ $labels.instance }} for 2m — the backend may be down or /health/metrics is unreachable."

      - alert: BackendUnhealthy
        expr: findyourbuddy_up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Backend reports itself unhealthy"
          description: "findyourbuddy_up has been 0 for 2m."

  - name: findyourbuddy_database
    rules:
      - alert: DatabaseDown
        expr: supabase_db_status == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Supabase/PostgreSQL is unreachable"
          description: "supabase_db_status has been 0 for 1m — the backend cannot reach the database."

      - alert: DatabasePoolNearExhaustion
        expr: supabase_db_active_connections > 24
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "DB connection pool > 80% used"
          description: "supabase_db_active_connections={{ $value }} (pool is 30). Sustained load or a connection leak."

      - alert: DatabasePoolExhausted
        expr: supabase_db_active_connections >= 30
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "DB connection pool exhausted"
          description: "supabase_db_active_connections={{ $value }} — new queries will block. Expect request timeouts."

  - name: findyourbuddy_load_test
    rules:
      # Only fires while a k6 run is streaming (load-test/docker-compose.k6.yml).
      - alert: LoadTestHighErrorRate
        expr: max(k6_http_req_failed_rate) > 0.1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "k6 load test: >10% requests failing"
          description: "The target is past its capacity for the current k6 profile."
