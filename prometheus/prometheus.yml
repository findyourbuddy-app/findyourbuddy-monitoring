global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alerts.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # FindYourBuddy backend. GET /health/metrics is staff-only; the scrape
  # authenticates with METRICS_API_KEY (see ../prometheus/metrics_token and the
  # backend .env). run_server.py usually binds 8001; 8000 is the uvicorn default.
  - job_name: "backend-api"
    metrics_path: "/health/metrics"
    scheme: http
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics_token
    static_configs:
      - targets: ["host.docker.internal:8001", "host.docker.internal:8000"]

  # k6 load-test samples arrive via remote-write (load-test/docker-compose.k6.yml),
  # not a scrape, so there is no k6 job here.
