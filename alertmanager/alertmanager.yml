# Routes Prometheus alerts to Slack. Put your incoming-webhook URL in
# ./alertmanager/slack_webhook_url (gitignored; copy from .example).
# Without a real URL the pipeline still runs — alerts just don't deliver.
global:
  resolve_timeout: 5m
  slack_api_url_file: /etc/alertmanager/slack_webhook_url

route:
  receiver: slack-warning
  group_by: ["alertname"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: [severity="critical"]
      receiver: slack-critical
      repeat_interval: 1h

receivers:
  - name: slack-warning
    slack_configs:
      - channel: "#alerts"
        send_resolved: true
        title: '{{ .CommonLabels.severity | toUpper }}: {{ .CommonAnnotations.summary }}'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ "\n" }}{{ end }}'

  - name: slack-critical
    slack_configs:
      - channel: "#alerts-critical"
        send_resolved: true
        title: '🔴 CRITICAL: {{ .CommonAnnotations.summary }}'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ "\n" }}{{ end }}'

inhibit_rules:
  - source_matchers: [severity="critical"]
    target_matchers: [severity="warning"]
    equal: ["alertname"]
