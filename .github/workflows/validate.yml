name: Validate monitoring config

on:
  push:
    branches: [main, Development]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: promtool check (Prometheus config + alert rules)
        run: |
          docker run --rm -v "$PWD/prometheus:/etc/prometheus" \
            --entrypoint promtool prom/prometheus:v2.51.0 \
            check config /etc/prometheus/prometheus.yml

      - name: amtool check (Alertmanager config)
        run: |
          docker run --rm -v "$PWD/alertmanager:/etc/alertmanager" \
            --entrypoint amtool prom/alertmanager:v0.27.0 \
            check-config /etc/alertmanager/alertmanager.yml

      - name: k6 script parses
        run: |
          docker run --rm -v "$PWD/load-test:/scripts" -w /scripts \
            grafana/k6:0.54.0 inspect scenario.js > /dev/null

      - name: Grafana dashboards are valid JSON
        run: |
          for f in grafana/dashboards/*.json; do
            python3 -c "import json,sys; json.load(open('$f'))" || exit 1
          done
